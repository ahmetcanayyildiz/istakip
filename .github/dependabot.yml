version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR per week for routine patches keeps review noise low; majors stay
      # separate so breaking upgrades are reviewed on their own.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
